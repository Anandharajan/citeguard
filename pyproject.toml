[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citeguard"
version = "0.1.0"
description = "Claim-level citation support and version-drift checking for LaTeX manuscripts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Anandharajan TRV", email = "trvanandharajan@gmail.com" }]
dependencies = [
  "pydantic>=2",
  "numpy"
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
nli = ["sentence-transformers>=3"]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov", "ruff", "mypy"]

[project.scripts]
citeguard = "citeguard.cli:main"
citeguard-mcp = "citeguard.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/citeguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B"]
ignore = ["B905", "B007", "E702"]
